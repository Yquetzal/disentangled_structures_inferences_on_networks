name: Tests, documentation and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - if: matrix.python == '3.9'
        run: python -m pip install numpy==1.22.0 scipy==1.11.4 networkx==2.8 pytest==7.0.0
      - if: matrix.python != '3.9'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]" build twine
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@v5
        with:
          name: documentation
          path: docs/_build/html/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        with:
          path: docs/_build/html/

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: [tests, package]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
