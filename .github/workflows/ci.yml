name: Tests, documentation and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - if: matrix.python == '3.9'
        run: python -m pip install numpy==1.22.0 scipy==1.11.4 networkx==2.8 pytest==7.0.0
      - if: matrix.python != '3.9'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]" build twine
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@v5
        with:
          name: documentation
          path: docs/_build/html/
