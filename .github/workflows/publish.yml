name: Publish a tagged version

# Explicit dispatch only: pushing the review or a tag never publishes to PyPI.
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index (configure its Trusted Publisher first)
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test,docs]" build twine
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check tag and version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import disentangled_net as dn
          from importlib.metadata import version
          assert os.environ["RELEASE_REF"] == "refs/tags/v" + dn.__version__, "Run on the version tag"
          assert version("disentangled-net") == dn.__version__, "Package and module versions differ"
          PY
      - run: python -m pytest -q
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: release-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-distributions
          path: dist/
      - if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
