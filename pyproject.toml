[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "disentangled-net"
version = "2.0.0"
description = "Communities and embeddings relative to a null model (spatial, block or custom)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DUPUY Guilhem", email = "guilhempds@gmail.com" },
    { name = "CAZABET Rémy", email = "remy.cazabet@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "scipy>=1.11.4", "networkx>=2.8"]

[project.optional-dependencies]
embeddings = ["torch>=2.0"]
test = ["pytest>=7"]
docs = ["sphinx>=7", "myst-parser>=2", "furo"]

[project.urls]
Source = "https://github.com/Yquetzal/disentangled_structures_inferences_on_networks"
Documentation = "https://yquetzal.github.io/disentangled_structures_inferences_on_networks/"
Issues = "https://github.com/Yquetzal/disentangled_structures_inferences_on_networks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/disentangled_net"]

[tool.pytest.ini_options]
testpaths = ["tests"]
