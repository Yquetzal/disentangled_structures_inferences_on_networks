[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
"Source" = "https://github.com/DeankoontzG/disentangled_structures_inferences_on_networks"
#"Paper" = "https://doi.org/10.XXXX/my-doi-ici"

[project]
name = "disentangled-net"
version = "0.1.0"
description = "Library to infer disentangled communities (Louvain-like) and disentangled embeddings"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "DUPUY Guilhem", email = "guilhempds@gmail.com" },
    { name = "CAZABET Rémy", email = "remy.cazabet@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.22,<2.0",
    "numpy<2",
    "scipy>=1.8",
    "torch>=2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/disentangled_net"]